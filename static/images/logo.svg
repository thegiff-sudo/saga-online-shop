<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="sagaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Shield / Bag Shape -->
    <rect x="2" y="10" width="60" height="58" rx="14" fill="url(#sagaGrad)"/>
    <!-- Bag Handle -->
    <path d="M 22 12 C 22 2, 42 2, 42 12" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Stylized S inside Bag -->
    <path d="M 43 28 C 40 23, 27 22, 24 28 C 21 34, 43 38, 40 46 C 37 53, 24 51, 21 47" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Star Accent -->
    <circle cx="50" cy="20" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <text x="86" y="47" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="1.5">SAGA</text>
  <text x="195" y="47" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#2563EB" letter-spacing="1">ONLINE SHOP</text>
  <rect x="86" y="55" width="225" height="2.5" rx="1.25" fill="url(#goldGrad)"/>
  <text x="87" y="69" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="2.8">TRENDING DROPSHIP DEALS</text>
</svg>
